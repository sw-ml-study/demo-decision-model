[package]
name = "tdm-web"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Browser demo: talk to a trained typed decision model, and trace every decision it makes."

[dependencies]
tdm-model = { path = "../tdm-model" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlInputElement", "KeyboardEvent", "Location", "Performance", "Window"] }
yew = { version = "0.21", features = ["csr"] }

[lints]
workspace = true
