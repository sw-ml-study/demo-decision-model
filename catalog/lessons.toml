schema = "sw-ml-study.decision-model-lessons"
version = 1

# One entry per accepted lesson. Required keys: id, slug, title, source, test,
# implementation, memory, speed, quality, status.
#
# implementation: "builtin" (calls shipped sw-MLPL features), "from-scratch"
# (the mechanism is the lesson), or "both" (a detailed form and a pragmatic form
# with a parity check between them).
#
# memory/speed/quality are the three measurement axes required by the visual and
# measurement contract in docs/plan.md. No lesson is "accepted" without all three.
#
# Lessons arrive as their saga lands; see docs/plan.md for the full progression.

[[lesson]]
id = "SL01"
slug = "thin-slice-chat"
title = "One Choice replaces a keyword list, and is confidently wrong off-distribution"
source = "demos/eliza/train.mlpl"
library = ["lib/decision.mlpl", "lib/text.mlpl", "lib/choice_model.mlpl", "demos/eliza/eliza.mlpl"]
test = ["tests/test_text.mlpl", "tests/test_choice_model.mlpl", "tests/test_eliza.mlpl"]
fixture = "fixtures/eliza/choice-v0.bin"
implementation = "from-scratch"
memory = "33,065 parameters (embedding 1,024x32 = 32,768; head 32x9 = 288; bias 9); 264,688 bytes as f64 in the saved native file; 24 padded features per input over 1,024 hash slots"
speed = "200 full-batch Adam steps over 232 examples in 23.5 s (mlpl-repl 0.22.0, M1 Max, about 88 ms per step); inference 0.5 to 2.1 ms per decision, 9-turn transcript end to end in 0.11 s including process start"
quality = "one Choice over 9 classes. train 1.000, val 0.879, wild 0.750; keyword matcher on the same rows 0.526 / 0.397 / 0.400; margin +0.474 / +0.483 / +0.350. Val per class: all 1.000 except COMPUTER 0.000 and NO 0.833. CALIBRATION NOT MEASURED -- the model is visibly overconfident (1.000 on most inputs, 0.786 while wrong on 'i bought a new car'); that is CB01's subject."
status = "provisional"

[[lesson]]
id = "TL01"
slug = "training-timeline"
title = "Accuracy is learned in two seconds; after that, training only buys confidence"
source = "demos/eliza/export.mlpl"
library = ["lib/choice_model.mlpl", "demos/eliza/eliza.mlpl"]
test = ["crates/tdm-model/tests/parity.rs"]
fixture = "fixtures/bundles/demo01.json"
implementation = "from-scratch"
memory = "five snapshots of the 33,065-parameter Choice model, rounded to 1e-4: bundle 1,571,861 bytes (520 KB gzipped); page WASM 1.83 MB (629 KB gzipped)"
speed = "one full-batch Adam run, snapshots after 0, 11, 22, 55 and 110 steps = 0, 1, 2, 5 and 10 s on an M1 Max (segments measured 1.04, 1.02, 3.05, 5.10 s); browser inference about 5 us per decision"
quality = "val accuracy 0.069 / 0.845 / 0.879 / 0.879 / 0.879; wild 0.10 / 0.80 / 0.75 / 0.75 / 0.75; mean confidence on 95 unlabelled probe inputs 0.115 / 0.514 / 0.740 / 0.808 / 0.811. Snapshot 0 is a uniform guess (0.11 per class). Accuracy settles at 2 s; confidence on inputs never trained on keeps rising to 10 s. The 1 s snapshot is the best behaved on the hand-written set. Rounding changed no decision (max 5.4e-5)."
status = "accepted"

[[lesson]]
id = "EH01"
slug = "escape-hatch-model"
title = "An exact vocabulary, a trained escape hatch and an escalation policy: fewer confident wrong replies"
source = "demos/eliza/v2/export.mlpl"
library = ["lib/text.mlpl", "lib/choice_model.mlpl", "demos/eliza/v2/domain.mlpl"]
test = ["crates/tdm-model/tests/vocab_bundle.rs", "demos/eliza/sim/tests/probe_ratchet.rs"]
fixture = "fixtures/bundles/demo01-model2.json"
implementation = "from-scratch"
memory = "38,129 parameters (1,174 x 32 vocabulary embedding, 32 x 17 head, 17 biases); five snapshots in a 2,157,264-byte bundle; page WASM 2.43 MB, 865 KB gzipped"
speed = "one Adam run over 2,808 rows (936 generated sentences plus two word-dropout copies), about 2.8 s per step in the interpreter; snapshots after 0, 3, 20, 100, 200 steps = 0 s, 9 s, 61 s, 280 s, 564 s measured"
quality = "on 96 frozen hand-labelled probes, after the policy (default 5 min snapshot, chosen by validation 0.884): reply class correct 69% vs 40% for the v1 model; right on 78% of non-escalated replies vs 38%; visible wrong COMPUTER replies 1 vs 12, wrong GREET 0 vs 7; escalates 33%, and in 28 of those 32 the model's own choice would have been wrong. Strict (78 probes never in training): 62% vs 38%, 70% vs 36% when not escalating, confidence when wrong 0.36 vs 0.72. Training past 5 min lowers validation (0.794 at 10 min). Labels, frames and yardstick are all the author's; the ELIZA-oracle corpus is the planned remedy."
status = "accepted"

[[lesson]]
id = "NH01"
slug = "noul-heads"
title = "Several typed questions per input from one forward pass; questions are turned back, not answered"
source = "demos/eliza/v2/export.mlpl"
library = ["lib/choice_model.mlpl", "demos/eliza/v2/domain.mlpl"]
test = ["crates/tdm-model/tests/noul_bundle.rs", "demos/eliza/sim/tests/probe_ratchet.rs", "demos/eliza/sim/tests/conversation.rs"]
fixture = "fixtures/bundles/demo01-model3.json"
implementation = "from-scratch"
memory = "41,905 parameters: a 1,292 x 32 vocabulary embedding, a 32 x 17 Choice head and a 32 x 3 Noul head over the same pooled state; bundle 2.47 MB"
speed = "one joint Adam run over 3,000 rows, about 7 s per step in the interpreter; snapshots at 0, 3, 20, 100, 200 steps measured at 0 s, 19 s, 2.3 min, 12 min, 23.1 min; all three Nouls come from the Choice's forward pass at no extra encoder cost"
quality = "default 12 min, chosen by mean validation accuracy over all four heads (0.898), not by the Choice alone, which peaks at 2.3 min while the Nouls keep improving. On 96 frozen probes: question Noul 0.98 accurate, catching 12 of 13 questions with 1% false alarms; negative 0.79 (recall 0.66); positive 0.94 but catching only 1 of 5 -- positives are rare in training and probes. Reply class correct 71% after policy, 77% when not escalating, escalated 19% (model 2: 33%); visible wrong COMPUTER 1, GREET 0."
status = "accepted"

[[lesson]]
