[[lesson]]
id = "RC01"
slug = "rule-choice"
title = "A Choice over another program's rules, learned from that program's own decisions"
source = "demos/eliza/v4/export.mlpl"
library = ["lib/choice_model.mlpl", "demos/eliza/sim/src/bin/featurize.rs"]
test = ["crates/tdm-model/tests/rule_bundle.rs", "demos/eliza/sim/tests/rules.rs", "demos/eliza/sim/tests/reported.rs"]
fixture = "fixtures/bundles/demo01-model4.json"
implementation = "from-scratch"
memory = "65,286 parameters: a 2,001 x 32 vocabulary embedding, a 32 x 35 Choice head over the script's rules and a 32 x 3 Noul head over the same pooled state; bundle 2.55 MB"
speed = "minibatches of 256 because one full-batch step over 7,595 rows costs 30 s in the interpreter; Adam's moments persist between calls, so 1,268 minibatch steps (42 epochs) fit in 10 min. Snapshots measured at 0 s, 10 s, 1 min, 5 min, 10 min."
quality = "default 5 min, chosen by mean validation accuracy over all four heads (0.950). Agreement with the oracle: 84.9% on the 869 held-out inputs (majority class 30.1%), 93.8% on the 96 probes (majority class 21.9%); the chosen rule's pattern fits the input 97.1% of the time and the reply is the oracle's word for word 85.5% of the time. Underconfident: mean confidence 0.72 when right, 0.43 when wrong, ECE 0.169. Question Noul 0.99 accurate (12 of 13 probes, no false alarms); positive Noul still catches only 1 of 5. Past 5 min validation agreement falls while confidence rises."
status = "accepted"

[[lesson]]
id = "DC01"
slug = "dynamic-choice-sets"
title = "Choices supplied as text: one set of weights scores candidates it never saw, and how badly that fails here"
source = "demos/eliza/v5/export.mlpl"
library = ["lib/scorer.mlpl", "demos/eliza/sim/src/bin/cards.rs"]
test = ["tests/test_scorer.mlpl", "crates/tdm-model/tests/scorer_bundle.rs"]
fixture = "fixtures/bundles/demo01-scorer.json"
implementation = "from-scratch"
memory = "79,905 parameters: a 2,401 x 32 shared text embedding read by inputs, questions and cards alike, three 32 x 32 projections and one learned scale. Adding a candidate costs nothing; a fixed head would cost a column and a retrain. Bundle 2.13 MB"
speed = "minibatches of 256 with the cards re-encoded every step; 674 steps (21 epochs) in 5 min. Snapshots measured at 0 s, 10 s, 1 min, 5 min."
quality = "Two questions (which of 51 DOCTOR rules answers; which of four Noul cards is true) answered by one set of weights. On cards that trained: 85.3% over the full 51-card field, against model 4's fixed head at 86.1% on the same rows -- generality costs about a point. On twelve rules held out of training entirely (479 rows): 0.4% in the full field, 36.5% in a five-card field with trained distractors, 18.6% against equally untrained ones, which is chance. Plain inner product scored 0.0% held out (trained cards accumulate magnitude); tying the card projection to the state projection gave 0.6% held out and cost 15 points on seen cards. A lower bound in an unfriendly regime: an ELIZA rule card shares little but function words with an input."
status = "accepted"

[[lesson]]
id = "TD01"
slug = "typed-decisions"
title = "The hello world: one state, three typed heads, and the difference between a classifier and a calibrated one"
source = "demos/typed-decisions/typed-decisions.mlpl"
library = ["lib/decision.mlpl", "lib/choice_model.mlpl"]
test = ["scripts/check-typed-decisions", "scripts/check-tangle"]
fixture = "docs/literate/typed-decisions.org"
implementation = "from-scratch"
memory = "11,655 parameters: a 721 x 16 vocabulary embedding shared by every head, a 16 x 3 Choice head, a 16 x 1 Noul head and a 16 x 3 Scale head. The bundled self-contained program, corpus included, is 41,872 bytes."
speed = "200 Adam steps over 72 messages, about 3 s wall on an M1 Max; all three decisions come from one forward pass over one pooled state."
quality = "On 24 held-out messages: category 0.750 (majority class 0.375), credentials 0.875, urgency 0.708. Calibration is the point of the lesson: as reported the model claims 0.912 mean confidence while being right 0.750 of the time (Brier 0.426, ECE 0.162); one temperature fitted on a separate 24-message calibration split (5.75) leaves every answer unchanged and brings the claim to 0.652 (Brier 0.404, ECE 0.097). Twenty-four messages cannot pin an ECE to the third decimal, and the document says so where it prints it."
status = "accepted"

[[lesson]]
id = "LB01"
slug = "llm-baseline"
title = "The comparison that settles it: local LLMs on the same held-out messages, by the same bounded-choice method"
source = "scripts/llm-baseline"
library = ["demos/typed-decisions/typed-decisions.mlpl"]
test = ["demos/typed-decisions/llm-baseline.tsv"]
fixture = "demos/typed-decisions/llm-baseline.tsv"
implementation = "baseline"
memory = "the models are downloaded, not built here: qwen3:0.6b, llama3.2:3b and gemma4:31b-mlx against this repository's 11,655-parameter model"
speed = "0.17 to 1.24 s per decision depending on model size, against microseconds for the trained model; 24 messages per arm, five arms"
quality = "On TD01's 24 held-out messages, by first-token top_logprobs renormalized over the legal answers: qwen3:0.6b 0.458 zero-shot and 0.500 with six examples, llama3.2:3b 0.792 and 0.750, gemma4:31b 1.000, against TD01's own 0.750. A 3B model beats the trained model without training; a 31B model answers every message correctly. Two secondary findings matter more: six in-prompt examples pushed qwen3:0.6b's first-token mass off the legal answer set entirely (0.34 legal mass), which is the objection raised under the original post and which a fixed three-column head cannot have; and llama3.2:3b is better calibrated untouched (ECE 0.006) than the trained model is after temperature scaling (0.097)."
status = "accepted"

[[lesson]]
id = "AT01"
slug = "atlas-rerank"
title = "Demo 02: a second domain, someone else's catalog, and what lib/ needed to survive it"
source = "demos/atlas/train.mlpl"
library = ["lib/scorer.mlpl", "lib/choice_model.mlpl", "demos/atlas/extract.py", "demos/atlas/featurize.py"]
test = ["probes/q6_sqrt_zero_gradient.mlpl", "tests/test_capability_probes.mlpl"]
fixture = "docs/experiments/AT01-atlas-rerank.md"
implementation = "from-scratch"
memory = "77,985 parameters for the rerank scorer over a 2,340-word vocabulary; 17,351 for the intent Choice and two Nouls. The catalog it scores over is 642 real resources, read from a downstream checkout and never copied here."
speed = "250 steps in 17.5 minutes: every step re-encodes all 642 cards at 64 features each, which is the cost of scoring cards rather than label columns."
quality = "Negative, and useful. Reranking the matcher's top 20: 0.023 warm and 0.032 cold against 0.050 for random, while training loss fell to 0.011 -- memorized 174 questions, transferred nothing. Intent 0.697 against a 0.737 majority baseline; the is-off-topic Noul landed exactly on its always-false baseline. The matcher it was meant to improve scores 0.233 and 0.209 accuracy@1 with recall@20 of 0.63, which is also the hybrid's ceiling. One configuration per head, no sweep, against question sets the downstream project still marks Unconfirmed. The durable result is the defect this found in lib/scorer.mlpl (Q6): a zero-norm row made every gradient NaN, silently."
status = "accepted"
