[workspace]
members = ["crates/tdm-trace", "crates/tdm-model", "crates/tdm-web"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

# The browser demo ships as WASM; size matters more than build time.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
